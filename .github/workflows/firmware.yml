# =====================================================================
#  Buduje binarke firmware i kladzie ja obok aplikacji na GitHub Pages,
#  zeby pudelko moglo sie zaktualizowac przez WiFi (D59).
#
#  Efektem sa DWA PLIKI NA PUDELKO w firmware/:
#    PillBox.bin      + PillBox.json       - pudelko dzienne  (~1,2 MB)
#    PillBoxWeek.bin  + PillBoxWeek.json   - pudelko tygodniowe (~1,1 MB)
#  Opis to wersja, suma MD5, rozmiar, data, commit i odcisk zrodla.
#
#  KAZDE PUDELKO MA WLASNY ODCISK ZRODLA i wlasny warunek publikacji.
#  Wspolny kazalby pudelku dziewczyny sciagac megabajt przez WiFi za
#  kazda poprawka w kodzie pilnujacym Warfinu - i odwrotnie.
#
#  Pudelko pobiera najpierw opis (kilkaset bajtow) i caly program sciaga
#  dopiero wtedy, gdy suma rozni sie od tej, ktora juz ma. Suma z opisu idzie
#  do `Update.setMD5()`, wiec zerwany transfer zostaje odrzucony.
#
#  Nie jest to natomiast obrona przed PODMIANA pliku: pudelko laczy sie bez
#  weryfikacji certyfikatu (setInsecure) i z Pages, i z Firebase. Probowalismy
#  porownywac sume z dwoch zrodel - przy dwoch nieweryfikowanych kanalach nie
#  dawalo to nic poza kosztem i zostalo cofniete w 1.40.0 (D59). Jedyna
#  uczciwa obrona to setCACert() i jest zapisana jako dlug.
#
#  HASLA TU NIE MA I BYC NIE MOZE. config.h w repo trzyma placeholder,
#  wiec binarka jest "pusta" - pudelko loguje sie haslem z wlasnej pamieci
#  trwalej (D59). To jest cala przyczyna, dla ktorej ten automat w ogole
#  moze istniec: gdyby haslo musialo byc wkompilowane, budowanie binarki
#  w publicznym repozytorium bylo by wyciekiem.
# =====================================================================
name: Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

# Bez tego krok commitujacy nie ma prawa zapisu.
permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CZY JEST Z CZEGO ZROBIC INNA BINARKE
      #
      # Guard "binarka bez zmian" stal nizej i NIE MIAL JAK sie odezwac
      # ani razu - a to, ze nie ma, zobaczyl Kuba: aplikacja meldowala
      # "jest nowa wersja" o tej samej wersji, a pudelko sciagalo 1,2 MB
      # przez WiFi z baterii, zeby zrestartowac sie na to samo.
      #
      # ZMIERZONE (D123): binarka NIE MOZE byc powtarzalna. Rdzen ESP32
      # wkompilowuje __DATE__ i __TIME__ ("Compile Date/Time" w Esp.cpp),
      # a naglowek obrazu niesie `app_elf_sha256`. Dwie kompilacje tego
      # samego zrodla w rozne dni roznia sie zawsze. D106 widziala same
      # bajty odcisku ELF i na nich poprzestala - stad diagnoza "staly
      # katalog budowania wystarczy". Nie wystarcza.
      #
      # Wiec nie pytamy o binarke, tylko o ZRODLO. Odcisk liczy
      # tests/zrodlo_firmware.sh i on jest jedynym zrodlem prawdy -
      # ten sam skrypt policzy go czlowiekowi.
      - name: Czy zrodlo firmware sie zmienilo
        run: |
          set -e
          sprawdz() {           # $1 = dzienne|tygodniowe, $2 = plik opisu, $3 = przyrostek
            TERAZ=$(bash tests/zrodlo_firmware.sh "$1")
            POPRZEDNI=$(python3 -c "import json;print(json.load(open('firmware/$2')).get('zrodlo',''))" 2>/dev/null || true)
            echo "[$1] zrodlo teraz:        $TERAZ"
            echo "[$1] zrodlo opublikowane: ${POPRZEDNI:-(brak)}"
            if [ -n "$POPRZEDNI" ] && [ "$TERAZ" = "$POPRZEDNI" ]; then
              echo "POMIN_$3=1" >> "$GITHUB_ENV"
              echo "[$1] -> bez zmian, nie ma czego publikowac"
            else
              echo "[$1] -> zrodlo inne (albo nieznane) - binarka pojdzie na Pages"
              echo "COKOLWIEK=1" >> "$GITHUB_ENV"
            fi
            echo "ZRODLO_$3=$TERAZ" >> "$GITHUB_ENV"
          }
          sprawdz dzienne    PillBox.json     D
          sprawdz tygodniowe PillBoxWeek.json T

      # Toolchain wazy ~500 MB, wiec trzymamy go miedzy uruchomieniami.
      # Klucz zawiera wersje rdzenia - jej podbicie ma unieważnić cache.
      - name: Cache toolchainu Arduino
        uses: actions/cache@v4
        with:
          path: ~/.pillbox-arduino
          key: arduino-esp32-3.3.11-${{ runner.os }}

      # Ten sam skrypt, ktorego uzywa czlowiek. Ustawienia plytki
      # (podzial pamieci, CDC) siedza w nim, a nie tutaj - inaczej
      # binarka z automatu roznilaby sie od tej wgrywanej kablem.
      - name: Kompilacja
        env:
          OTA_OUT: ${{ runner.temp }}/ota
          OTA_WEEK_OUT: ${{ runner.temp }}/ota
        run: bash tests/kompiluj_firmware.sh

      - name: Opis wersji
        run: |
          set -e
          OUT="${{ runner.temp }}/ota"

          # Funkcje wolamy WPROST, nie przez $(...): w podpowloce `exit 1`
          # konczy tylko ja, a komunikat "BLAD: ..." wpadlby do zmiennej
          # zamiast do logu - czyli automat zatrzymalby sie bez powodu na
          # ekranie. Numer wersji idzie do GITHUB_ENV pod nazwa z $5.
          opis() {   # $1 = plik .bin z kompilacji, $2 = katalog szkicu,
                     # $3 = nazwa docelowa (bez rozszerzenia), $4 = odcisk
                     # zrodla, $5 = nazwa zmiennej na numer wersji
            BIN="$OUT/$1"
            test -f "$BIN" || { echo "BLAD: kompilacja nie zostawila $1"; exit 1; }

            WERSJA=$(grep -oP '#define\s+FW_VERSION\s+"\K[^"]+' "$2/config.h")
            MD5=$(md5sum "$BIN" | cut -d' ' -f1)
            ROZMIAR=$(stat -c%s "$BIN")

            # Zdrowy rozsadek: te same granice, ktorych pilnuje firmware
            # (OTA_MIN_BIN_SIZE / OTA_MAX_BIN_SIZE). Lepiej zatrzymac sie
            # tutaj niz wypuscic plik, ktorego pudelko i tak odrzuci.
            if [ "$ROZMIAR" -lt 300000 ] || [ "$ROZMIAR" -gt 1900000 ]; then
              echo "BLAD: rozmiar $ROZMIAR poza zakresem, ktory przyjmuje pudelko"
              exit 1
            fi

            # Placeholder MUSI zostac. Gdyby ktos kiedys wrzucil config.h
            # z prawdziwym haslem, ten krok zatrzyma automat, zanim haslo
            # trafi do binarki lezacej publicznie na GitHub Pages.
            if ! grep -q 'TUTAJ_WPISZ_HASLO' "$2/config.h"; then
              echo "BLAD: $2/config.h nie ma placeholdera - czy ktos wrzucil prawdziwe haslo?"
              exit 1
            fi

            # Skladamy artefakty POZA repo. Krok publikacji przestawia galaz
            # na najswiezszy main i dopiero wtedy je tam kopiuje - inaczej
            # `reset --hard` skasowalby wlasnie to, co zbudowalismy.
            cp "$BIN" "$OUT/$3.bin"
            cat > "$OUT/$3.json" <<EOF
          {
            "wersja": "$WERSJA",
            "md5": "$MD5",
            "rozmiar": $ROZMIAR,
            "zbudowano": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA}",
            "zrodlo": "$4"
          }
          EOF
            echo "$3: wersja $WERSJA, $ROZMIAR B, md5 $MD5"
            echo "$5=$WERSJA" >> "$GITHUB_ENV"
          }

          opis pbino.ino.bin  firmware/PillBox     PillBox     "$ZRODLO_D" WERSJA_D
          opis pbwino.ino.bin firmware/PillBoxWeek PillBoxWeek "$ZRODLO_T" WERSJA_T

      # Kompilacja wyzej idzie ZAWSZE - to jedyne automatyczne sprawdzenie,
      # czy firmware sie buduje, i obejmuje takze pudelko tygodniowe.
      # Warunek wisi dopiero tutaj, na publikacji.
      - name: Publikacja
        if: env.COKOLWIEK == '1'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bierzemy NAJNOWSZY main i dopiero na niego kladziemy artefakty.
          #
          # TU BYL BLAD: automat commitowal na stanie sprzed kompilacji i robil
          # `git push`. Gdy w tym czasie ktos wypchnal cokolwiek innego, push
          # konczyl sie "! [rejected] main -> main (fetch first)" i cala budowa
          # szla do kosza - binarka nie trafiala na serwer, choc skompilowala
          # sie poprawnie. Zdarzylo sie to przy pierwszej probie wypuszczenia
          # 1.40.0, bo rownolegle wchodzil commit z dokumentacja.
          #
          # `reset --hard` jest tu bezpieczny, bo .bin i .json sa WYNIKIEM
          # kompilacji, nie edycji: lezą poza repo (w runner.temp) i kopiujemy
          # je z powrotem po przestawieniu galezi. Nic recznego nie ginie.
          git fetch origin main
          git reset --hard origin/main

          # KOPIUJEMY TYLKO TO, CO SIE ZMIENILO. Kazde pudelko ma wlasny
          # odcisk zrodla, wiec poprawka w jednym nie kaze drugiemu sciagac
          # megabajta przez WiFi z baterii.
          OPIS=""
          if [ "${POMIN_D:-0}" != "1" ]; then
            cp "${{ runner.temp }}/ota/PillBox.bin"  firmware/PillBox.bin
            cp "${{ runner.temp }}/ota/PillBox.json" firmware/PillBox.json
            git add firmware/PillBox.bin firmware/PillBox.json
            OPIS="dzienne $WERSJA_D"
          fi
          if [ "${POMIN_T:-0}" != "1" ]; then
            cp "${{ runner.temp }}/ota/PillBoxWeek.bin"  firmware/PillBoxWeek.bin
            cp "${{ runner.temp }}/ota/PillBoxWeek.json" firmware/PillBoxWeek.json
            git add firmware/PillBoxWeek.bin firmware/PillBoxWeek.json
            OPIS="${OPIS:+$OPIS, }tygodniowe $WERSJA_T"
          fi

          # Tu NIE MA juz guarda porownujacego pliki - stal tu i nie dzialal,
          # bo opis trzyma date budowania, wiec zmienial sie co przebieg
          # niezaleznie od binarki. O tym, czy w ogole tu wchodzimy,
          # decyduja odciski zrodel policzone na samym poczatku.
          # [skip ci] zamyka petle: ten commit dotyka firmware/, wiec bez
          # tego wyzwolilby ten sam workflow jeszcze raz, i tak w kolko.
          git commit -m "Firmware ($OPIS) do aktualizacji przez WiFi [skip ci]"

          # Nawet z odswiezona galezia ktos moze zdazyc wejsc miedzy fetch
          # a push. Trzy podejscia zamiast jednego i przegranej calej budowy.
          for i in 1 2 3; do
            git push && exit 0
            echo "push odrzucony - odswiezam i probuje ponownie ($i/3)"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep 5
          done
          echo "BLAD: nie udalo sie wypchnac binarki po trzech probach"
          exit 1
